version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Majors wait for the WordPress configs to accept them; see README "ESLint" and "Stylelint".
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: stylelint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
